# Local PostgreSQL for development. Bound to localhost only.
services:
  db:
    # PostgreSQL 18 keeps data in /var/lib/postgresql/18/docker -> mount the parent directory.
    image: postgres:18
    environment:
      POSTGRES_USER: storyboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: storyboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
volumes:
  pgdata18:
